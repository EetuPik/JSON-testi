<h1>Helsingin sää</h1>

<div id="vastaus"></div>


<script>

const URL = "https://api.openweathermap.org/data/2.5/weather?id=658225&appid=665ecd56dfc08dbb50feb8b8f5034e28&lang=fi&units=metric";


fetch(URL)

    // Muutetaan vastaus JSON-muotoon
    .then(function(response) {

        return response.json();

    })

    // Käsitellään JSON-muotoinen vastaus
    .then(function(data) {

        console.log(data);


        // Haetaan sääkuvan numero
        let kuva = data.weather[0].icon;


        // Luodaan sääkuvan osoite
        let kuvaurl = "https://openweathermap.org/img/wn/" + kuva + "@2x.png";


        // Näytetään tiedot sivulla
        document.getElementById("vastaus").innerHTML =

            "<h2>Helsingin sää</h2>" +

            "<p><b>Sää:</b> " +
            data.weather[0].description +
            "</p>" +

            "<p><b>Lämpötila:</b> " +
            data.main.temp +
            " °C</p>" +

            "<p><b>Tuuli:</b> " +
            data.wind.speed +
            " m/s</p>" +

            "<p><b>Kuva:</b></p>" +

            "<img src='" + kuvaurl + "' alt='Sääkuva'>";


        // Näytetään sivun latausaika
        document.getElementById("vastaus").innerHTML +=

            "<p><b>Sivu ladattu:</b> " +
            new Date().toLocaleTimeString("fi-FI") +
            "</p>";

    });

</script>
