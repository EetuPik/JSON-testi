<div class="container mt-4">

  <div id="vastaus"></div>

</div>


<script>

// Luodaan funktio, joka vastaanottaa JSON-tiedoston tiedot
// muuttujassa nimeltä olio
function kerro(olio) {

  // Luodaan tyhjä merkkijono osallistujien nimiä varten
  let nimet = "";


  // Käydään kaikki olio.nimet-taulukon nimet yksitellen läpi
  olio.nimet.forEach(function(nimi) {

    // Lisätään jokainen nimi listan <li>-elementiksi
    nimet += `<li>${nimi}</li>`;

  });


  // Etsitään HTML-sivulta elementti id:llä "vastaus"
  // ja kirjoitetaan sen sisälle JSON-tiedoston tiedot
  document.getElementById("vastaus").innerHTML = `

    <!-- Näytetään toteutuksen nimi -->
    <h1>${olio.nimi}</h1>


    <!-- Näytetään toteutukseen liittyvä kuva -->
    <img src="${olio.kuva}"
         class="img-fluid mb-4"
         width="500"
         alt="${olio.nimi}">


    <!-- Otsikko toteutuksen muille tiedoille -->
    <h2>Toteutuksen tiedot</h2>


    <!-- Näytetään osallistujien määrä -->
    <p>
      <strong>Osallistujia:</strong>
      ${olio.osallistujat} kpl
    </p>


    <!-- Näytetään toteutuksen alkamisaika -->
    <p>
      <strong>Alkamisaika:</strong>
      ${olio.alkamisaika}
    </p>


    <!-- Näytetään toteutuksen loppumisaika -->
    <p>
      <strong>Loppumisaika:</strong>
      ${olio.loppumisaika}
    </p>


    <!-- Näytetään toteutuksen kesto -->
    <p>
      <strong>Kesto:</strong>
      ${olio.kesto}
    </p>


    <!-- Osallistujien otsikko -->
    <h2>Osallistujat</h2>


    <!-- Näytetään osallistujien nimet listana -->
    <ul>
      ${nimet}
    </ul>

  `;

}


// Haetaan toteutus.json-tiedosto fetch-komennolla
fetch("toteutus.json")


  // Kun tiedosto on löytynyt, muutetaan vastaus JSON-muotoon
  .then(function(response) {

    return response.json();

  })


  // Kun JSON on muutettu JavaScript-olioksi,
  // välitetään se kerro()-funktiolle
  .then(function(responseJson) {

    kerro(responseJson);

  })


  // Jos tiedoston hakemisessa tai käsittelyssä tapahtuu virhe,
  // suoritetaan tämä kohta
  .catch(function(error) {

    // Näytetään käyttäjälle virheilmoitus sivulla
    document.getElementById("vastaus").innerHTML =
      "<p>Tietoa ei pystytä hakemaan</p>";

    // Tulostetaan tarkempi virhe selaimen konsoliin
    console.log(error);

  });

</script>




</body>
