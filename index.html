<!DOCTYPE html>
<html lang="fi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JSON</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>


<body>

<nav class="navbar p-3 mx-5 navbar-expand-sm bg-info navbar-white">

  <div class="container-fluid ms-5">

    <a class="navbar-brand" href="#">#</a>

    <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapsibleNavbar">

      <span class="navbar-toggler-icon"></span>

    </button>

    <div class="collapse navbar-collapse" id="collapsibleNavbar">

      <ul class="navbar-nav">

        <li class="nav-item">
          <a class="nav-link" href="index.html">Teht1 OSA1</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="toteutus.html">Teht1 OSA2</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="poke.html">Teht2</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="saa.html">Teht3</a>
        </li>

      </ul>

    </div>

  </div>

</nav>


<div class="container mt-4">

  <div id="vastaus"></div>

</div>


<script>

function kerro(olio) {

  let tekniikat = "";

  olio.tekniikat.forEach(function(tekniikka) {

    tekniikat += `
      <li>
        <a href="${tekniikka.linkki}" target="_blank">
          ${tekniikka.aihe}
        </a>
      </li>
    `;

  });


  document.getElementById("vastaus").innerHTML = `

    <h1>${olio.otsikko}</h1>

    <p>${olio.kuvaus}</p>

    <img src="${olio.kuva}"
         class="img-fluid mb-4"
         width="500"
         alt="${olio.otsikko}">


    <h2>Opintojakso</h2>

    <p>Nimi: ${olio.opintojakso.nimi}</p>

    <p>Tunnus: ${olio.opintojakso.tunnus}</p>

    <p>Opintopisteet: ${olio.opintojakso.opintopisteet}</p>


    <h2>Sisältö</h2>

    <ul>
      ${olio.sisalto.map(function(asia) {
        return `<li>${asia}</li>`;
      }).join("")}
    </ul>


    <h2>Tekniikat</h2>

    <ul>
      ${tekniikat}
    </ul>

  `;
}

  // Haetaan JSON-tiedosto
  fetch("tietue.json")


    // Muunnetaan vastaus JS-olio muotoon
    .then(function (response) {

      return response.json();

    })


    // Käsitellään muunnettu JSON-vastaus
    // ja kutsutaan kerro()-funktiota
    .then(function (responseJson) {

      kerro(responseJson);

    })


    // Jos hakemisessa tuli virhe
    .catch(function (error) {

      document.getElementById("vastaus").innerHTML =
        "<p>Tietoa ei pystytä hakemaan</p>";

    });

</script>


</body>

</html>
