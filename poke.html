<h1>Pokemon haku</h1>


<p>

  <input type="text"
         id="pokemonName"
         placeholder="Enter Pokemon name">

  <button onclick="poke()">Hae</button>

</p>


<div id="nimi">
  Kirjoita laatikkoon Pokemonin nimi
</div>


<div id="vastaus"></div>


<p id="kuva2"></p>


<!-- Tähän tulee Käännä-painike -->
<div id="kaanto"></div>


<!-- Tähän tulevat Pokemonin ominaisuudet -->
<div id="ominaisuudet"></div>


<script>

let pokeName;
let name;


function poke() {

    // Tallennetaan Pokemonin nimi pienillä kirjaimilla
    pokeName = document.getElementById("pokemonName").value.toLowerCase();

    // Tallennetaan alkuperäinen nimi
    name = document.getElementById("pokemonName").value;


    // Haetaan Pokemonin tiedot
    fetch(`https://pokeapi.co/api/v2/pokemon/${pokeName}`)

        // Muunnetaan vastaus JSON-muotoon
        .then(function (response) {

            return response.json();

        })


        // Käsitellään JSON-muotoinen vastaus
        .then(function (responseJson) {

            pokekuva(responseJson);

        })


        // Jos tuli jokin virhe
        .catch(function (error) {

            document.getElementById("vastaus").innerHTML =
                "<p>Tietoa ei pystytä hakemaan</p>";

        });

}


function pokekuva(obj) {

    // Tallennetaan muuttujaan linkki,
    // josta löytyy Pokemonin kuva
    let pokeurl = obj.sprites.front_default;


    // Näytetään Pokemonin kuva
    document.getElementById("kuva2").innerHTML =
        "<img src=" + pokeurl + ">";


    // Näytetään Pokemonin nimi
    document.getElementById("nimi").innerHTML =
        "<b>" + name + "</b>";


    // Tyhjennetään hakukenttä
    document.getElementById("pokemonName").value = "";


    // Luodaan Käännä-painike
    document.getElementById("kaanto").innerHTML =
        '<button onclick="kaanna()">Käännä</button>';


    // Näytetään kolme Pokemonin ominaisuutta
    document.getElementById("ominaisuudet").innerHTML =
        "<h3>Pokemonin ominaisuudet</h3>" +
        "<p><b>Korkeus:</b> " + obj.height + "</p>" +
        "<p><b>Paino:</b> " + obj.weight + "</p>" +
        "<p><b>Base experience:</b> " + obj.base_experience + "</p>";

}


function kaanna() {

    // Haetaan Pokemon uudelleen
    fetch(`https://pokeapi.co/api/v2/pokemon/${pokeName}`)

        // Muunnetaan vastaus JSON-muotoon
        .then(function (response) {

            return response.json();

        })


        // Näytetään Pokemonin takaa otettu kuva
        .then(function (responseJson) {

            let pokeurl = responseJson.sprites.back_default;

            document.getElementById("kuva2").innerHTML =
                "<img src=" + pokeurl + ">";

        })


        // Jos tuli virhe
        .catch(function (error) {

            document.getElementById("vastaus").innerHTML =
                "<p>Tietoa ei pystytä hakemaan</p>";

        });

}

</script>
